# Separate virtual host; the existing Money dashboard is unchanged.
limit_req_zone $binary_remote_addr zone=pyla_relay:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=pyla_relay_conn:1m;

server {
    listen 80;
    server_name pyla-api.185-251-38-246.sslip.io;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name pyla-api.185-251-38-246.sslip.io;
    ssl_certificate /etc/letsencrypt/live/pyla-api.185-251-38-246.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyla-api.185-251-38-246.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    access_log off;

    location /v1/players/ {
        limit_req zone=pyla_relay burst=5 nodelay;
        limit_req_status 429;
        limit_conn pyla_relay_conn 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host pyla-relay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
    }
    location / { return 404; }
}
